<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102c36">
  <meta name="description" content="Controla tu nómina, gastos, deudas y ahorro por quincena. Tus datos se guardan en tu dispositivo.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mi Quincena">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Mi Quincena · Finanzas personales</title>
  <style>
    :root{--ink:#152d34;--ink2:#567079;--bg:#f5f7f5;--surface:#fff;--line:#e3e9e5;--mint:#d8f4e6;--green:#17765c;--green2:#42c799;--navy:#112e38;--negative:#b24b52;--gold:#eeb86d;--shadow:0 11px 36px rgba(16,49,53,.065);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}a{color:var(--green)}
    .shell{max-width:1040px;min-height:100vh;margin:auto;display:grid;grid-template-columns:215px minmax(0,1fr);background:var(--bg)}
    .sidebar{background:var(--surface);border-right:1px solid var(--line);padding:33px 17px 26px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:28px}
    .brand{display:flex;align-items:center;gap:11px;padding:0 11px}.brand-mark{width:42px;height:42px;border-radius:15px;background:var(--navy);display:grid;place-items:center;color:#a9f6cd;font-size:24px;font-weight:900}.brand-txt{font-size:18px;font-weight:850;letter-spacing:-.6px;line-height:1.15}.brand-sub{font-size:10px;font-weight:650;letter-spacing:1.6px;color:var(--green);text-transform:uppercase}
    .nav{display:flex;flex-direction:column;gap:6px}.nav-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-radius:13px;background:transparent;color:#5b7177;font-weight:650;padding:11px 13px}.nav-btn.active{color:var(--green);background:#e8f6ed}.nav-icon{font-size:19px;width:24px;text-align:center}.side-note{margin-top:auto;border-radius:15px;padding:15px;background:#eaf5f0;color:#40695a;font-size:12px}.side-note strong{display:block;color:#1e644e;margin-bottom:4px}
    .content{padding:29px 34px 115px;min-width:0}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;margin-bottom:24px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.8px;color:var(--green);font-weight:800;margin:0 0 5px}.heading{font-size:clamp(25px,3vw,34px);font-weight:850;line-height:1.15;letter-spacing:-1.2px;margin:0}.sub{color:var(--ink2);margin:9px 0 0;font-size:13px}
    .period{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:13px;background:#fff;padding:4px;white-space:nowrap;box-shadow:0 2px 10px rgba(10,30,40,.03)}.period-label{padding:0 8px;font-size:12px;font-weight:700}.square-btn{display:grid;place-items:center;background:#f3f7f4;border:0;border-radius:9px;min-width:32px;height:32px;font-size:17px;color:var(--ink)}
    .card{border-radius:20px;background:var(--surface);padding:22px;border:1px solid #e9eeea;box-shadow:var(--shadow)}.hero{background:linear-gradient(120deg,#112f39,#194d47 78%,#1e6c58);color:white;border:0;padding:29px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;border:1px solid rgba(255,255,255,.1);width:240px;height:240px;right:-130px;top:-80px;border-radius:100%}.hero-label{color:#b6dbd2;font-size:13px;font-weight:700}.hero-money{font-size:clamp(34px,5vw,49px);font-weight:850;line-height:1.2;letter-spacing:-2px;margin:9px 0}.hero-foot{color:#b9dfd6;font-size:12px}.hero-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.hero-chip{padding:8px 12px;border-radius:11px;background:rgba(255,255,255,.1);font-size:12px}.hero-chip strong{display:block;color:white;font-size:16px}
    .kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin-top:15px}.kpi{padding:17px 19px}.small-label{font-size:11px;color:var(--ink2);font-weight:700;letter-spacing:.1px}.big-num{font-weight:850;font-size:22px;letter-spacing:-.6px;margin-top:7px}.green{color:var(--green)}.red{color:var(--negative)}.muted{color:var(--ink2)}
    .rowhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:28px 0 13px}.section-title{font-size:18px;font-weight:820;letter-spacing:-.5px;margin:0}.tiny{font-size:12px;color:var(--ink2)}.linkbtn{border:0;background:none;color:var(--green);font-size:12px;font-weight:800;padding:5px}
    .actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.action{background:#fff;border:1px solid var(--line);border-radius:16px;min-height:91px;padding:15px 10px;text-align:center;color:var(--ink);font-weight:750;font-size:12px}.action:hover{border-color:#a3d9bb;background:#fbfffc}.action .aicon{font-size:24px;display:block;margin:0 0 7px}
    .split{display:grid;grid-template-columns:1.2fr 1fr;gap:15px}.progress{height:9px;background:#e9efeb;border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--green2);border-radius:99px;width:0}.budget-line{margin-bottom:17px}.budget-top{display:flex;justify-content:space-between;gap:5px;margin-bottom:7px;font-size:12px}.budget-top strong{font-weight:750}.empty{padding:25px 16px;border:1px dashed #cddbd4;border-radius:15px;text-align:center;color:var(--ink2);font-size:13px}.empty .emoji{display:block;font-size:28px;margin-bottom:5px}.movement{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #edf1ee}.movement:last-child{border-bottom:0}.move-icon{height:39px;width:39px;border-radius:12px;background:#eaf3ee;display:grid;place-items:center;flex:none;font-size:19px}.move-main{min-width:0;flex:1}.move-main strong{display:block;font-size:13px;overflow-wrap:anywhere}.move-meta{font-size:11px;color:var(--ink2)}.move-amount{font-weight:800;white-space:nowrap;font-size:13px}.trash{border:0;background:transparent;color:#98a7a2;font-size:18px;padding:8px;border-radius:9px}.trash:hover{background:#fff0f0;color:var(--negative)}
    .btn{border:1px solid transparent;border-radius:12px;padding:11px 16px;font-weight:800;font-size:13px;background:var(--green);color:white}.btn.secondary{background:#ecf7f0;color:var(--green);border-color:#d8ede0}.btn.ghost{background:white;color:var(--ink);border-color:var(--line)}.btn.danger{background:#fae9ea;color:#ae444e}.btn.tinybtn{padding:8px 11px;font-size:11px}.btnrow{display:flex;gap:8px;flex-wrap:wrap}.blanktip{border-radius:13px;background:#eef8f2;border:1px solid #e0f0e5;padding:13px 15px;font-size:12px;color:#3a6651;margin-top:17px}
    .debtgrid,.goalgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.debtcard{padding:21px}.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:7px}.debtname{font-size:17px;line-height:1.25;font-weight:800;margin:0;overflow-wrap:anywhere}.tag{display:inline-block;border-radius:99px;background:#e6f6ec;color:var(--green);padding:3px 9px;font-weight:800;font-size:10px}.tag.gold{background:#fff3de;color:#95702d}.debtbalance{font-weight:850;font-size:28px;letter-spacing:-.8px;margin:14px 0 0}.debtfoot{display:flex;justify-content:space-between;font-size:11px;color:var(--ink2);margin:7px 0 10px}.debt-buttons{margin-top:15px;display:flex;gap:7px;flex-wrap:wrap}.debt-buttons .btn{font-size:11px;padding:9px 11px}
    .statsbar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:16px}.statlabel{font-size:12px;color:#bdded2}.stattotal{font-size:30px;font-weight:850;color:#fff}
    .field{display:flex;flex-direction:column;gap:7px;margin-bottom:15px}.field label{font-size:12px;color:#405960;font-weight:800}.field input,.field select,.field textarea{width:100%;border:1px solid #d8e3dc;background:white;color:var(--ink);border-radius:11px;padding:12px 13px;outline:none;min-height:45px}.field input:focus,.field select:focus,.field textarea:focus{border-color:#299b76;box-shadow:0 0 0 3px rgba(42,163,118,.11)}.field small{font-size:11px;color:var(--ink2)}.two-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.modal-back{position:fixed;inset:0;background:rgba(7,30,35,.53);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}.modal{width:min(100%,475px);max-height:min(90vh,760px);overflow:auto;border-radius:21px;padding:24px;background:#fff;box-shadow:0 20px 80px rgba(3,25,20,.18)}.modal h2{margin:0 0 4px;font-size:22px;letter-spacing:-.5px}.modal p{margin:0 0 19px;color:var(--ink2);font-size:12px}.modal-close{float:right;background:#f1f5f2;border:0;width:33px;height:33px;border-radius:10px;font-size:20px}
    .filterset{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.filterset button{border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:20px;padding:7px 13px;font-size:11px;font-weight:750}.filterset button.selected{background:var(--navy);color:#fff;border-color:var(--navy)}
    .settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.settings-grid .field{margin:0}.settings-card{margin-top:16px}.notice{font-size:12px;color:var(--ink2);background:#f4f7f5;padding:14px;border-radius:12px}.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#102e36;color:#fff;border-radius:12px;padding:12px 18px;z-index:200;box-shadow:0 12px 30px rgba(0,0,0,.14);font-size:12px;max-width:90vw;pointer-events:none}.hidden{display:none!important}
    .opening-strip{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:14px;padding:17px 21px}.opening-value{font-size:16px;margin:2px 0 3px}.opening-strip .btn{flex-shrink:0}.bottomnav{display:none}.footer-note{text-align:center;color:#8b9c95;font-size:11px;padding-top:26px}.screen{animation:appear .15s ease}@keyframes appear{from{opacity:.6;transform:translateY(3px)}to{opacity:1;transform:none}}
    @media(max-width:840px){.shell{grid-template-columns:1fr}.sidebar{display:none}.content{padding:24px 19px 115px}.bottomnav{position:fixed;display:grid;grid-template-columns:repeat(5,1fr);bottom:0;left:0;right:0;background:rgba(255,255,255,.98);border-top:1px solid var(--line);z-index:50;padding:8px max(7px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(7px,env(safe-area-inset-left));box-shadow:0 -5px 30px rgba(15,51,38,.05)}.bottomnav .nav-btn{flex-direction:column;gap:2px;border-radius:11px;padding:6px 2px;font-size:9px;text-align:center}.bottomnav .nav-icon{font-size:20px}.bottomnav .nav-btn.active{background:#edf8f1}}
    @media(max-width:600px){.content{padding:23px 15px 105px}.top{align-items:flex-start;flex-direction:column;margin-bottom:20px}.period{align-self:flex-start}.hero{padding:22px}.hero-money{font-size:36px}.kpis{gap:8px}.kpi{padding:14px 11px}.big-num{font-size:17px}.small-label{font-size:10px}.actions{gap:8px}.action{min-height:81px;padding:12px 3px;font-size:10px}.split,.debtgrid,.goalgrid{grid-template-columns:1fr}.card{padding:18px}.hero{padding:22px}.two-fields{gap:10px}.rowhead{margin:23px 0 11px}.modal{padding:20px}.heading{font-size:30px}}
    @media(max-width:380px){.big-num{font-size:15px}.hero-money{font-size:32px}.move-icon{height:34px;width:34px}.action .aicon{font-size:21px}}
    @media(max-width:580px){.opening-strip{flex-direction:column;align-items:flex-start}.opening-strip .btn{width:100%}}
  </style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">₱</div><div><div class="brand-txt">Mi Quincena</div><div class="brand-sub">Dinero en orden</div></div></div>
    <nav class="nav" id="desktopNav"></nav>
    <div class="side-note"><strong>🔒 Tus finanzas son tuyas</strong>Esta versión guarda la información en tu dispositivo. Exporta un respaldo con frecuencia.</div>
  </aside>
  <main class="content" id="app" role="main"></main>
</div>
<nav class="bottomnav" id="mobileNav" aria-label="Navegación principal"></nav>
<div id="modalRoot"></div><div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
(() => {
  'use strict';
  const KEY='mi_quincena_mx_v1';
  const CATEGORIES=['Hogar','Despensa','Servicios','Transporte','Salud','Educación','Entretenimiento','Otros'];
  const ICONS={income:'💵',expense:'🧾',debt_payment:'💳',debt_charge:'📈',saving_deposit:'🐷',saving_withdraw:'↩️'};
  const NAV=[['resumen','⌂','Inicio'],['movimientos','⇄','Movimientos'],['deudas','▤','Deudas'],['ahorro','◈','Ahorro'],['ajustes','⚙','Ajustes']];
  const fresh=()=>({version:2,opening:null,movements:[],debts:[],goals:[{id:'goal-default',name:'Fondo de emergencia',target:0}],budgets:{}});
  let state=load(),page='resumen',filter='all',selectedPeriod=getPeriod(localDate()),activeModal=null,toastTimer;
  const el=id=>document.getElementById(id);
  function load(){try{const parsed=JSON.parse(localStorage.getItem(KEY));if(parsed&&Array.isArray(parsed.movements)&&Array.isArray(parsed.debts)&&Array.isArray(parsed.goals)&&parsed.budgets&&typeof parsed.budgets==='object'){if(!Object.prototype.hasOwnProperty.call(parsed,'opening'))parsed.opening=null;return parsed;}}catch(e){}return fresh();}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true;}catch(e){toast('No se pudo guardar. Revisa el espacio disponible en el navegador.');return false;}}
  function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function uid(){return (typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);}
  function amount(v){const n=Number(v);return Number.isFinite(n)&&n>=0?Math.round((n+Number.EPSILON)*100)/100:0;}
  function positive(v){const n=Number(v);return Number.isFinite(n)&&n>0&&n<=999999999?Math.round((n+Number.EPSILON)*100)/100:null;}
  function money(n){return new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:2}).format(Number(n)||0);}
  function localDate(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');}
  function getPeriod(date){const [year,month,day]=date.split('-').map(Number);return{y:year,m:month,h:day<=15?1:2};}
  function bounds(p){const start=`${p.y}-${String(p.m).padStart(2,'0')}-${p.h===1?'01':'16'}`;let end;if(p.h===1)end=`${p.y}-${String(p.m).padStart(2,'0')}-15`;else end=`${p.y}-${String(p.m).padStart(2,'0')}-${new Date(p.y,p.m,0).getDate()}`;return{start,end};}
  function periodName(p){const month=new Intl.DateTimeFormat('es-MX',{month:'long'}).format(new Date(p.y,p.m-1,1));return`${p.h===1?'1–15':'16–'+new Date(p.y,p.m,0).getDate()} de ${month} ${p.y}`;}
  function shiftPeriod(delta){let n=pnum(selectedPeriod)+delta;let y=Math.floor(n/24),rest=n-y*24;selectedPeriod={y,m:Math.floor(rest/2)+1,h:rest%2+1};render();}
  function pnum(p){return p.y*24+(p.m-1)*2+(p.h-1);}
  function defaultDay(){let today=localDate();return pnum(getPeriod(today))===pnum(selectedPeriod)?today:bounds(selectedPeriod).start;}
  function inPeriod(item,p=selectedPeriod){const b=bounds(p);return item.date>=b.start&&item.date<=b.end;}
  function allTransactions(p=selectedPeriod){return state.movements.filter(m=>inPeriod(m,p));}
  function sum(items){return Math.round(items.reduce((a,m)=>a+(Number(m.amount)||0),0)*100)/100;}
  // El saldo de apertura es una fotografía del efectivo al INICIO de la fecha elegida.
  // Solamente se suman movimientos desde esa fecha, y nunca se duplica por quincena.
  function balanceThrough(date){const opening=state.opening;if(opening&&date<opening.date)return null;
    const after=opening?.date||'0000-01-01',sign={income:1,expense:-1,debt_payment:-1,debt_charge:0,saving_deposit:-1,saving_withdraw:1};
    const changes=state.movements.reduce((total,m)=>m.date>=after&&m.date<=date?total+(sign[m.type]||0)*m.amount:total,0);
    return Math.round(((opening?.amount||0)+changes)*100)/100;
  }
  function summary(p=selectedPeriod){const t=allTransactions(p);const inc=sum(t.filter(x=>x.type==='income')),exp=sum(t.filter(x=>x.type==='expense')),debt=sum(t.filter(x=>x.type==='debt_payment')),saved=sum(t.filter(x=>x.type==='saving_deposit')),withdrawn=sum(t.filter(x=>x.type==='saving_withdraw'));return{inc,exp,debt,saved,withdrawn,net:Math.round((inc-exp-debt-saved+withdrawn)*100)/100,available:balanceThrough(bounds(p).end)};}
  function debtBalance(d){const charges=sum(state.movements.filter(x=>x.type==='debt_charge'&&x.debtId===d.id));const payments=sum(state.movements.filter(x=>x.type==='debt_payment'&&x.debtId===d.id));return Math.max(0,Math.round((Number(d.initial)+charges-payments)*100)/100);}
  function goalBalance(g){return Math.round((sum(state.movements.filter(x=>x.type==='saving_deposit'&&x.goalId===g.id))-sum(state.movements.filter(x=>x.type==='saving_withdraw'&&x.goalId===g.id)))*100)/100;}
  function totalSavings(){return state.goals.reduce((acc,g)=>acc+goalBalance(g),0);}
  function totalDebts(){return state.debts.reduce((acc,d)=>acc+debtBalance(d),0);}
  function pct(done,total){return total>0?Math.max(0,Math.min(100,done/total*100)):0;}
  function navHtml(){return NAV.map(([id,icon,label])=>`<button class="nav-btn ${page===id?'active':''}" data-action="nav" data-page="${id}" type="button" ${page===id?'aria-current="page"':''}><span class="nav-icon" aria-hidden="true">${icon}</span>${label}</button>`).join('');}
  function header(eyebrow,title,desc,withPeriod=true){return `<header class="top"><div><p class="eyebrow">${eyebrow}</p><h1 class="heading">${title}</h1><p class="sub">${desc}</p></div>${withPeriod?`<div class="period"><button class="square-btn" data-action="prev" title="Quincena anterior" aria-label="Quincena anterior">‹</button><span class="period-label">${safe(periodName(selectedPeriod))}</span><button class="square-btn" data-action="next" title="Quincena siguiente" aria-label="Quincena siguiente">›</button></div>`:''}</header>`;}
  function miniMovements(items,showTrash=false){if(!items.length)return`<div class="empty"><span class="emoji">📝</span>Aún no hay movimientos aquí.</div>`;return items.map(m=>{
    const d=state.debts.find(x=>x.id===m.debtId),g=state.goals.find(x=>x.id===m.goalId);
    const info={income:['Ingreso','Ingreso'],expense:[m.category||'Gasto','Gasto'],debt_payment:[d?.name||'Deuda','Abono a deuda'],debt_charge:[d?.name||'Deuda','Cargo adicional (no afecta efectivo)'],saving_deposit:[g?.name||'Ahorro','Guardado'],saving_withdraw:[g?.name||'Ahorro','Retiro de ahorro']}[m.type]||['Movimiento',''];
    const title=m.note?.trim()||info[0];const sub=`${info[1]} · ${m.date.split('-').reverse().slice(0,2).join('/')} · ${m.date.slice(0,4)}`;
    const plus=['income','saving_withdraw'].includes(m.type),noncash=m.type==='debt_charge';
    return`<div class="movement"><div class="move-icon" aria-hidden="true">${ICONS[m.type]||'•'}</div><div class="move-main"><strong>${safe(title)}</strong><div class="move-meta">${safe(sub)}</div></div><span class="move-amount ${plus?'green':noncash?'muted':''}">${noncash?'+':plus?'+':'−'}${money(m.amount)}</span>${showTrash?`<button class="trash" data-action="delete-movement" data-id="${safe(m.id)}" aria-label="Eliminar movimiento" title="Eliminar">×</button>`:''}</div>`;
  }).join('');}
  function actionButtons(){return`<div class="actions"><button class="action" data-action="modal" data-kind="income"><span class="aicon">💰</span>Registrar nómina</button><button class="action" data-action="modal" data-kind="expense"><span class="aicon">🧾</span>Agregar gasto</button><button class="action" data-action="modal" data-kind="debt_payment"><span class="aicon">💳</span>Abonar deuda</button><button class="action" data-action="modal" data-kind="saving_deposit"><span class="aicon">🐷</span>Guardar ahorro</button></div>`;}
  function home(){const s=summary(),tx=allTransactions().filter(m=>m.type!=='debt_charge').sort((a,b)=>b.date.localeCompare(a.date)||(b.created||0)-(a.created||0)).slice(0,5),budgets=CATEGORIES.filter(c=>Number(state.budgets[c])>0).map(cat=>{const spent=sum(allTransactions().filter(m=>m.type==='expense'&&m.category===cat)),budget=Number(state.budgets[cat]);return`<div class="budget-line"><div class="budget-top"><strong>${safe(cat)}</strong><span>${money(spent)} / ${money(budget)}</span></div><div class="progress"><i style="width:${pct(spent,budget)}%;background:${spent>budget?'#cd7274':'var(--green2)'}"></i></div></div>`;}).join('');
    const advice=!state.opening?'Primero registra cuánto dinero disponible tienes hoy en «Saldo inicial» para llevar un control completo.':s.available===null?'Este período es anterior a tu saldo inicial.':'Tu saldo disponible está por debajo de cero; verifica si faltan ingresos o si debes ajustar tus gastos.';
    const actualAdvice=state.opening&&s.available!==null&&s.available>=0?(s.inc===0?'Registra tu nómina neta cuando recibas el depósito.':s.saved===0?'Puedes separar una cantidad pequeña para una meta de ahorro.':`Llevas ${money(s.saved)} apartados esta quincena.`):advice;
    const openingInfo=state.opening?`<strong>${money(state.opening.amount)}</strong><span class="muted"> · al inicio del ${safe(state.opening.date)}</span>`:'<strong>Sin registrar</strong><span class="muted"> · agrega el dinero que ya tienes</span>';
    const cashLabel=s.available===null?'Saldo no calculado':money(s.available);
    return header('Tu control financiero','Hola, ¿cómo va tu quincena?','Todo lo que necesitas para tomar mejores decisiones con tu dinero.')+`<section class="screen"><div class="card hero"><div class="hero-label">Saldo disponible acumulado</div><div class="hero-money">${cashLabel}</div><div class="hero-foot">${s.available===null?'Este período es anterior a la fecha del saldo inicial.':'Saldo inicial + ingresos − gastos − abonos − ahorro + retiros, hasta el final de la quincena elegida.'}</div><div class="hero-chips"><div class="hero-chip">Ingreso recibido<strong>${money(s.inc)}</strong></div><div class="hero-chip">Gastos<strong>${money(s.exp)}</strong></div><div class="hero-chip">Deudas pagadas<strong>${money(s.debt)}</strong></div><div class="hero-chip">Cambio de esta quincena<strong>${money(s.net)}</strong></div></div></div><div class="card opening-strip"><div><div class="small-label">Saldo inicial disponible</div><div class="opening-value">${openingInfo}</div><div class="tiny">Dinero que tenías antes de comenzar a registrar movimientos (sin contar ahorros apartados).</div></div><button class="btn secondary tinybtn" data-action="modal" data-kind="opening_balance">${state.opening?'Editar saldo':'Agregar saldo inicial'}</button></div><div class="kpis"><div class="card kpi"><div class="small-label">Ahorro de quincena</div><div class="big-num green">${money(s.saved-s.withdrawn)}</div></div><div class="card kpi"><div class="small-label">Deudas pendientes</div><div class="big-num">${money(totalDebts())}</div></div><div class="card kpi"><div class="small-label">Ahorro acumulado</div><div class="big-num green">${money(totalSavings())}</div></div></div><div class="rowhead"><h2 class="section-title">Registra tu dinero</h2></div>${actionButtons()}<div class="blanktip">💡 ${safe(actualAdvice)}</div><div class="split"><section><div class="rowhead"><h2 class="section-title">Presupuesto por categoría</h2><button class="linkbtn" data-action="nav" data-page="ajustes">Definir límites →</button></div><div class="card">${budgets||`<div class="empty"><span class="emoji">🗂️</span>Define límites en Ajustes para repartir tus gastos por categoría.</div>`}</div></section><section><div class="rowhead"><h2 class="section-title">Últimos movimientos</h2><button class="linkbtn" data-action="nav" data-page="movimientos">Ver todos →</button></div><div class="card" style="padding-top:9px;padding-bottom:9px">${miniMovements(tx)}</div></section></div></section>`;}
  function movements(){let tx=allTransactions().sort((a,b)=>b.date.localeCompare(a.date)||(b.created||0)-(a.created||0));if(filter!=='all')tx=tx.filter(m=>filter==='out'?['expense','debt_payment'].includes(m.type):filter==='in'?m.type==='income':filter==='saving'?m.type.startsWith('saving_'):m.type==='debt_charge');const s=summary();const filters=[['all','Todos'],['out','Gastos y abonos'],['in','Ingresos'],['saving','Ahorro'],['charges','Cargos de deuda']];return header('Historial quincenal','Tus movimientos','Cada ingreso y salida queda registrado con su fecha.')+`<section class="screen"><div class="card"><div class="statsbar"><div><div class="small-label">Saldo acumulado al cierre</div><div class="big-num ${s.available!==null&&s.available<0?'red':'green'}">${s.available===null?'—':money(s.available)}</div><div class="tiny">Cambio de quincena: ${money(s.net)}</div></div><div class="btnrow"><button class="btn secondary tinybtn" data-action="modal" data-kind="income">+ Ingreso</button><button class="btn tinybtn" data-action="modal" data-kind="expense">+ Gasto</button></div></div><div class="filterset">${filters.map(([f,l])=>`<button class="${filter===f?'selected':''}" data-action="filter" data-filter="${f}">${l}</button>`).join('')}</div>${miniMovements(tx,true)}</div></section>`;}
  function debts(){const total=totalDebts();const dlist=state.debts.map(d=>{const remaining=debtBalance(d),base=Number(d.initial)+sum(state.movements.filter(x=>x.type==='debt_charge'&&x.debtId===d.id));return`<article class="card debtcard"><div class="card-top"><h3 class="debtname">${safe(d.name)}</h3><span class="tag ${remaining?'gold':''}">${remaining?'Pendiente':'Liquidada'}</span></div><div class="small-label" style="margin-top:16px">Saldo pendiente</div><div class="debtbalance ${remaining?'':'green'}">${money(remaining)}</div><div class="debtfoot"><span>Pagado: ${money(Math.max(0,base-remaining))}</span><span>${Math.round(pct(base-remaining,base))}%</span></div><div class="progress"><i style="width:${pct(base-remaining,base)}%"></i></div><div class="debt-buttons"><button class="btn tinybtn" data-action="modal" data-kind="debt_payment" data-id="${safe(d.id)}" ${remaining<=0?'disabled':''}>+ Registrar abono</button><button class="btn ghost tinybtn" data-action="modal" data-kind="debt_charge" data-id="${safe(d.id)}">+ Cargo</button><button class="btn ghost tinybtn" data-action="edit-debt" data-id="${safe(d.id)}">Editar</button><button class="btn danger tinybtn" data-action="delete-debt" data-id="${safe(d.id)}">Eliminar</button></div></article>`;}).join('');return header('Control de compromisos','Mis deudas','Cada abono reduce el saldo y se descuenta de tu quincena.')+`<section class="screen"><div class="card hero"><div class="statsbar"><div><div class="statlabel">Total pendiente por pagar</div><div class="stattotal">${money(total)}</div></div><span style="font-size:36px">💳</span></div><span class="hero-foot">${state.debts.filter(d=>debtBalance(d)>0).length} deuda(s) activa(s) · ${state.debts.length} registrada(s)</span></div><div class="rowhead"><h2 class="section-title">Tus deudas</h2><button class="btn tinybtn" data-action="modal" data-kind="debt">+ Nueva deuda</button></div>${dlist?`<div class="debtgrid">${dlist}</div>`:`<div class="empty"><span class="emoji">🎉</span>No has registrado deudas. Puedes agregar una tarjeta, préstamo o deuda personal.</div>`}<div class="blanktip">Los cargos o intereses adicionales se registran con «+ Cargo» para que el saldo sea correcto. Esos cargos no se restan del efectivo hasta que los pagues.</div></section>`;}
  function savings(){const balance=totalSavings();const list=state.goals.map(g=>{const b=goalBalance(g),target=Number(g.target)||0;return`<article class="card debtcard"><div class="card-top"><h3 class="debtname">${safe(g.name)}</h3><span class="tag">Meta</span></div><div class="small-label" style="margin-top:17px">Tienes ahorrado</div><div class="debtbalance green">${money(b)}</div><div class="debtfoot"><span>${target?`Objetivo: ${money(target)}`:'Aún sin cantidad objetivo'}</span><span>${target?Math.round(pct(b,target))+'%':''}</span></div><div class="progress"><i style="width:${pct(b,target)}%"></i></div><div class="debt-buttons"><button class="btn tinybtn" data-action="modal" data-kind="saving_deposit" data-id="${safe(g.id)}">+ Ahorrar</button><button class="btn secondary tinybtn" data-action="modal" data-kind="saving_withdraw" data-id="${safe(g.id)}" ${b<=0?'disabled':''}>Retirar</button><button class="btn ghost tinybtn" data-action="edit-goal" data-id="${safe(g.id)}">Editar</button><button class="btn danger tinybtn" data-action="delete-goal" data-id="${safe(g.id)}">Eliminar</button></div></article>`;}).join('');return header('Tu tranquilidad','Ahorros y metas','Separa el dinero que guardas para que no lo confundas con lo disponible.')+`<section class="screen"><div class="card hero"><div class="hero-label">Ahorro total acumulado</div><div class="hero-money">${money(balance)}</div><div class="hero-foot">Total ahorrado menos retiros de todas tus metas</div></div><div class="rowhead"><h2 class="section-title">Tus metas</h2><button class="btn tinybtn" data-action="modal" data-kind="goal">+ Nueva meta</button></div>${list?`<div class="goalgrid">${list}</div>`:'<div class="empty">Crea una meta de ahorro para comenzar.</div>'}<div class="blanktip">El ahorro no es un gasto: lo mostramos aparte y lo apartamos de tu saldo disponible. Si retiras ahorro, vuelve a sumarse al dinero disponible de esa quincena.</div></section>`;}
  function settings(){const entries=CATEGORIES.map(c=>`<div class="field"><label for="budget-${safe(c)}">${safe(c)}</label><input id="budget-${safe(c)}" name="${safe(c)}" type="number" step="0.01" min="0" inputmode="decimal" value="${Number(state.budgets[c])||0}" aria-label="Presupuesto para ${safe(c)}"></div>`).join('');return header('Personaliza tu control','Ajustes y respaldos','Planea tus categorías de gasto para cada quincena.',false)+`<section class="screen"><div class="card"><h2 class="section-title" style="margin-bottom:6px">Saldo inicial de tu dinero</h2><p class="sub" style="margin-bottom:12px">${state.opening?`Saldo registrado: <strong>${money(state.opening.amount)}</strong> al inicio del ${safe(state.opening.date)}.`:'Todavía no has registrado el dinero con el que empiezas.'}</p><p class="sub" style="margin-bottom:15px">Incluye el efectivo y las cuentas que tienes disponibles, sin contar ahorro separado. Se suma una sola vez; el saldo se arrastra automáticamente entre quincenas.</p><div class="btnrow"><button class="btn secondary" data-action="modal" data-kind="opening_balance">${state.opening?'Editar saldo inicial':'Registrar saldo inicial'}</button>${state.opening?'<button class="btn ghost" data-action="reset-opening">Quitar saldo inicial</button>':''}</div></div><div class="card settings-card"><h2 class="section-title" style="margin-bottom:6px">Límites por quincena</h2><p class="sub" style="margin-bottom:19px">Son referencias para ordenar el dinero. No descuentan efectivo por sí solas. Deja 0 para no establecer límite.</p><form id="budgetForm"><div class="settings-grid">${entries}</div><div class="form-actions"><button type="submit" class="btn">Guardar límites</button></div></form></div><div class="card settings-card"><h2 class="section-title" style="margin-bottom:7px">Mis datos</h2><p class="sub" style="margin-bottom:18px">Todo queda en este navegador. Sin cuenta, sin publicidad y sin conexión obligatoria.</p><div class="btnrow"><button class="btn secondary" data-action="export-json">⬇ Respaldo completo</button><button class="btn ghost" data-action="export-csv">⬇ Movimientos CSV</button><button class="btn ghost" data-action="import">⬆ Restaurar respaldo</button></div><input id="backupInput" type="file" accept=".json,application/json" class="hidden" aria-label="Selecciona un respaldo JSON"><p class="notice" style="margin-top:18px">Importar reemplaza todos los registros actuales. Un respaldo JSON contiene información privada: consérvalo en un lugar seguro.</p></div><div class="card settings-card"><h2 class="section-title" style="margin-bottom:6px">Analiza tu quincena con ChatGPT</h2><p class="sub" style="margin-bottom:16px">Copia un resumen y compártelo en nuestra conversación si quieres que te ayude a detectar fugas de dinero. No se comparte automáticamente.</p><button class="btn secondary" data-action="copy-summary">📋 Copiar resumen</button></div><div class="footer-note">Mi Quincena v1.1 · Pesos mexicanos (MXN) · Almacenamiento local</div></section>`;}
  function render(){el('desktopNav').innerHTML=navHtml();el('mobileNav').innerHTML=navHtml();el('app').innerHTML=({resumen:home,movimientos:movements,deudas:debts,ahorro:savings,ajustes:settings}[page]||home)();}
  function toast(msg){const t=el('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),3500);}
  function field(label,name,type='text',opts=''){return`<div class="field"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" ${opts} required></div>`;}
  function select(name,label,options,selected){return`<div class="field"><label for="f-${name}">${label}</label><select id="f-${name}" name="${name}" required>${options.map(o=>{const [v,t]=Array.isArray(o)?o:[o,o];return`<option value="${safe(v)}" ${v===selected?'selected':''}>${safe(t)}</option>`;}).join('')}</select></div>`;}
  function dateAmount(){return`<div class="two-fields">${field('Cantidad en MXN','amount','number','min="0.01" step="0.01" inputmode="decimal" placeholder="0.00"')}${field('Fecha','date','date',`value="${defaultDay()}"`)}</div>`;}
  function note(value=''){return`<div class="field"><label for="f-note">Concepto (opcional)</label><input id="f-note" name="note" maxlength="100" value="${safe(value)}" placeholder="Ej. Pago de octubre"></div>`;}
  function modal(kind,id){let title='',desc='',body='',submit='Guardar';activeModal={kind,id};const debtOpts=state.debts.filter(d=>kind==='debt_charge'||debtBalance(d)>0).map(d=>[d.id,`${d.name} · resta ${money(debtBalance(d))}`]);const goalOpts=state.goals.map(g=>[g.id,`${g.name} · ${money(goalBalance(g))}`]);
    if(kind==='opening_balance'){title=state.opening?'Editar saldo inicial':'Registrar saldo inicial';desc='Es el dinero disponible que ya tenías al comenzar, no un ingreso de nómina.';body=field('Dinero disponible en MXN','amount','number',`min="0" max="999999999" step="0.01" inputmode="decimal" placeholder="0.00" value="${state.opening?.amount??''}"`)+field('Fecha en que inicia tu control','date','date',`value="${state.opening?.date||localDate()}"`)+`<div class="notice">Anota cuánto tenías al comenzar ese día, antes de registrar los gastos o ingresos de esa fecha. Los movimientos anteriores quedan en tu historial, pero ya no se suman al saldo disponible. El ahorro ya apartado se registra por separado.</div>`;}
    if(kind==='income'){title='Registrar ingreso';desc='Anota lo que realmente recibiste en tu cuenta.';body=select('source','Tipo de ingreso',[['Nómina','Nómina (neto depositado)'],['Extra','Ingreso extra'],['Otro','Otro ingreso']],'Nómina')+dateAmount()+note('Pago de nómina');}
    if(kind==='expense'){title='Registrar gasto';desc='Cada gasto se resta del dinero disponible.';body=select('category','Categoría',CATEGORIES,'Despensa')+dateAmount()+note();}
    if(kind==='debt'){title='Nueva deuda';desc='Escribe el saldo que debes hoy, no el límite de la tarjeta.';body=field('Nombre de la deuda','name','text','maxlength="75" placeholder="Tarjeta, préstamo, familiar..."')+field('Saldo inicial en MXN','amount','number','min="0.01" step="0.01" inputmode="decimal" placeholder="0.00"')+`<div class="notice">Al registrar una deuda no se descuenta dinero de la quincena. Solo se descuenta cuando haces abonos.</div>`;}
    if(kind==='debt_payment'){if(!debtOpts.length){toast('Primero agrega una deuda con saldo pendiente.');return;}title='Abonar a una deuda';desc='El saldo pendiente bajará automáticamente y tu dinero disponible también.';body=select('debtId','Deuda',debtOpts,id)+dateAmount()+note('Abono a deuda');}
    if(kind==='debt_charge'){if(!state.debts.length){toast('Primero registra una deuda.');return;}title='Agregar cargo o interés';desc='Aumenta lo pendiente sin restar efectivo en esta quincena.';body=select('debtId','Deuda',debtOpts,id)+dateAmount()+note('Interés o cargo adicional');}
    if(kind==='goal'){title='Crear meta de ahorro';desc='Separa tu dinero por objetivos.';body=field('Nombre de la meta','name','text','maxlength="75" placeholder="Ej. Vacaciones, fondo de emergencia"')+field('Cantidad objetivo en MXN','target','number','min="0" step="0.01" inputmode="decimal" value="0"');}
    if(kind==='saving_deposit'||kind==='saving_withdraw'){if(!goalOpts.length){toast('Crea primero una meta de ahorro.');return;}title=kind==='saving_deposit'?'Guardar dinero':'Retirar ahorro';desc=kind==='saving_deposit'?'Lo que ahorres se aparta de tu disponible.':'El retiro vuelve a tu dinero disponible.';body=select('goalId','Meta de ahorro',goalOpts,id)+dateAmount()+note(kind==='saving_deposit'?'Aportación de ahorro':'Retiro de ahorro');}
    if(kind==='edit-debt'){const d=state.debts.find(d=>d.id===id);if(!d)return;title='Editar deuda';desc='Puedes corregir el nombre y el saldo original; tus abonos se conservarán.';body=field('Nombre de la deuda','name','text',`maxlength="75" value="${safe(d.name)}"`)+field('Saldo inicial','amount','number',`min="0.01" step="0.01" inputmode="decimal" value="${d.initial}"`);}
    if(kind==='edit-goal'){const g=state.goals.find(g=>g.id===id);if(!g)return;title='Editar meta';desc='Modifica la cantidad objetivo sin alterar tus aportaciones.';body=field('Nombre de la meta','name','text',`maxlength="75" value="${safe(g.name)}"`)+field('Cantidad objetivo','target','number',`min="0" step="0.01" inputmode="decimal" value="${g.target}"`);}
    el('modalRoot').innerHTML=`<div class="modal-back" data-action="backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><button class="modal-close" data-action="close" aria-label="Cerrar">×</button><h2 id="modalTitle">${title}</h2><p>${desc}</p><form id="dataForm">${body}<div class="form-actions"><button type="button" class="btn ghost" data-action="close">Cancelar</button><button type="submit" class="btn">${submit}</button></div></form></div></div>`;document.body.style.overflow='hidden';setTimeout(()=>el('modalRoot').querySelector('input,select')?.focus(),0);
  }
  function closeModal(){activeModal=null;el('modalRoot').innerHTML='';document.body.style.overflow='';}
  function addMove(m){state.movements.push({id:uid(),created:Date.now(),...m});save();closeModal();render();toast('Movimiento guardado.');}
  function formSubmit(e){e.preventDefault();if(!activeModal)return;const f=new FormData(e.target),kind=activeModal.kind,id=activeModal.id,amt=positive(f.get('amount')),name=String(f.get('name')||'').trim(),n=String(f.get('note')||'').trim(),date=String(f.get('date')||'');
    if(kind==='opening_balance'){const value=Number(f.get('amount'));if(!String(f.get('amount')??'').trim()||!Number.isFinite(value)||value<0||value>999999999||!/^(\d{4})-(\d{2})-(\d{2})$/.test(date)||Number.isNaN(new Date(date+'T12:00:00').getTime())){toast('Indica un monto desde $0 y una fecha válida.');return;}state.opening={amount:amount(value),date};state.version=2;save();closeModal();render();toast('Saldo inicial guardado.');return;}
    if(kind==='debt'||kind==='edit-debt'){if(!name||!amt){toast('Indica nombre y una cantidad válida.');return;}if(kind==='debt'){state.debts.push({id:uid(),name,initial:amt});}else{const d=state.debts.find(d=>d.id===id);if(!d)return;const paid=sum(state.movements.filter(m=>m.type==='debt_payment'&&m.debtId===id)),charges=sum(state.movements.filter(m=>m.type==='debt_charge'&&m.debtId===id));if(amt+charges+0.001<paid){toast('El saldo inicial no puede quedar por debajo de los abonos ya realizados.');return;}d.name=name;d.initial=amt;}save();closeModal();render();toast('Deuda guardada.');return;}
    if(kind==='goal'||kind==='edit-goal'){const target=Number(f.get('target'));if(!name||!Number.isFinite(target)||target<0||target>999999999){toast('Revisa el nombre y la cantidad objetivo.');return;}if(kind==='goal')state.goals.push({id:uid(),name,target:amount(target)});else{const g=state.goals.find(g=>g.id===id);if(!g)return;g.name=name;g.target=amount(target);}save();closeModal();render();toast('Meta guardada.');return;}
    if(!amt||!/^\d{4}-\d{2}-\d{2}$/.test(date)||Number.isNaN(new Date(date+'T12:00:00').getTime())){toast('Indica fecha y cantidad válidas.');return;}
    if(kind==='debt_payment'||kind==='debt_charge'){const debtId=String(f.get('debtId')),d=state.debts.find(x=>x.id===debtId);if(!d){toast('Selecciona una deuda.');return;}if(kind==='debt_payment'&&amt>debtBalance(d)+.001){toast(`El abono supera el saldo pendiente de ${money(debtBalance(d))}.`);return;}addMove({type:kind,date,amount:amt,debtId,note:n});return;}
    if(kind==='saving_deposit'||kind==='saving_withdraw'){const goalId=String(f.get('goalId')),g=state.goals.find(x=>x.id===goalId);if(!g){toast('Selecciona una meta.');return;}if(kind==='saving_withdraw'&&amt>goalBalance(g)+.001){toast(`Solo tienes ${money(goalBalance(g))} en esta meta.`);return;}addMove({type:kind,date,amount:amt,goalId,note:n});return;}
    if(kind==='income')addMove({type:kind,date,amount:amt,source:String(f.get('source')),note:n});
    if(kind==='expense')addMove({type:kind,date,amount:amt,category:String(f.get('category')),note:n});
  }
  function deleteMovement(id){const m=state.movements.find(x=>x.id===id);if(!m)return;if(confirm('¿Eliminar este movimiento? Se recalcularán saldos, deudas y ahorros.')){state.movements=state.movements.filter(x=>x.id!==id);save();render();toast('Movimiento eliminado.');}}
  function deleteDebt(id){const d=state.debts.find(x=>x.id===id);if(!d)return;const count=state.movements.filter(m=>m.debtId===id).length;if(confirm(`¿Eliminar «${d.name}»? También se eliminarán ${count} abono(s)/cargo(s) asociados y se recalcularán las quincenas.`)){state.debts=state.debts.filter(x=>x.id!==id);state.movements=state.movements.filter(x=>x.debtId!==id);save();render();toast('Deuda eliminada.');}}
  function deleteGoal(id){const g=state.goals.find(x=>x.id===id);if(!g)return;const count=state.movements.filter(m=>m.goalId===id).length;if(confirm(`¿Eliminar «${g.name}»? También se borrarán ${count} movimiento(s) de ahorro relacionados.`)){state.goals=state.goals.filter(x=>x.id!==id);state.movements=state.movements.filter(x=>x.goalId!==id);save();render();toast('Meta eliminada.');}}
  function downloadFile(filename,data,mime){const blob=new Blob([data],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);}
  function exportJSON(){downloadFile(`mi-quincena-respaldo-${localDate()}.json`,JSON.stringify(state,null,2),'application/json');toast('Respaldo descargado.');}
  function exportCSV(){const rows=[['Fecha','Tipo','Cantidad MXN','Categoría o concepto','Nota','Deuda o meta']];const data=state.movements.map(m=>{const entity=state.debts.find(x=>x.id===m.debtId)?.name||state.goals.find(x=>x.id===m.goalId)?.name||'';return[m.date,m.type,m.amount,m.category||m.source||'',m.note||'',entity];});if(state.opening)data.push([state.opening.date,'saldo_inicial',state.opening.amount,'Saldo de apertura','Dinero disponible al inicio del día','']);data.sort((a,b)=>a[0].localeCompare(b[0])||(a[1]==='saldo_inicial'?-1:b[1]==='saldo_inicial'?1:0));rows.push(...data);const csv='\ufeff'+rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');downloadFile(`mi-quincena-movimientos-${localDate()}.csv`,csv,'text/csv;charset=utf-8');toast('CSV descargado.');}
  function validBackup(v){if(!v||!Array.isArray(v.movements)||!Array.isArray(v.debts)||!Array.isArray(v.goals)||typeof v.budgets!=='object'||v.budgets===null||v.movements.length>100000||v.debts.length>5000||v.goals.length>5000)return false;
    const types=['income','expense','debt_payment','debt_charge','saving_deposit','saving_withdraw'];if(!v.movements.every(x=>x&&typeof x.id==='string'&&types.includes(x.type)&&/^\d{4}-\d{2}-\d{2}$/.test(x.date)&&Number.isFinite(x.amount)&&x.amount>0))return false;
    if(!v.debts.every(x=>x&&typeof x.id==='string'&&typeof x.name==='string'&&Number.isFinite(x.initial)&&x.initial>0))return false;
    if(!v.goals.every(x=>x&&typeof x.id==='string'&&typeof x.name==='string'&&Number.isFinite(x.target)&&x.target>=0))return false;
    if(v.opening!=null&&(!Number.isFinite(v.opening.amount)||v.opening.amount<0||v.opening.amount>999999999||typeof v.opening.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(v.opening.date)||Number.isNaN(new Date(v.opening.date+'T12:00:00').getTime())))return false;
    return v.movements.every(x=>x.type==='debt_payment'||x.type==='debt_charge'?v.debts.some(d=>d.id===x.debtId):x.type.startsWith('saving_')?v.goals.some(g=>g.id===x.goalId):true);
  }
  function importJSON(file){if(!file||file.size>5*1024*1024){toast('Archivo ausente o demasiado grande (máximo 5 MB).');return;}const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(!validBackup(obj)){toast('El archivo no es un respaldo válido de Mi Quincena.');return;}if(!confirm('¿Restaurar este respaldo? Se reemplazarán TODOS los datos actuales.'))return;state={version:2,opening:obj.opening||null,movements:obj.movements,debts:obj.debts,goals:obj.goals,budgets:obj.budgets};save();page='resumen';render();toast('Respaldo restaurado.');}catch(e){toast('No se pudo leer el archivo JSON.');}};reader.readAsText(file);}
  function copySummary(){const s=summary(),bs=CATEGORIES.map(c=>{const spent=sum(allTransactions().filter(x=>x.type==='expense'&&x.category===c));return spent>0?`- ${c}: ${money(spent)}`:null;}).filter(Boolean).join('\n');const msg=`Resumen de finanzas (${periodName(selectedPeriod)})\nSaldo inicial: ${state.opening?`${money(state.opening.amount)} al ${state.opening.date}`:'No registrado'}\nIngresos: ${money(s.inc)}\nGastos: ${money(s.exp)}\nAbonos a deuda: ${money(s.debt)}\nAhorro neto apartado: ${money(s.saved-s.withdrawn)}\nCambio neto esta quincena: ${money(s.net)}\nDisponible acumulado: ${s.available===null?'No calculable antes de apertura':money(s.available)}\nDeudas pendientes (total actual): ${money(totalDebts())}\nAhorro total acumulado: ${money(totalSavings())}\nGastos por categoría:\n${bs||'Sin gastos registrados'}\nAyúdame a encontrar oportunidades para ahorrar y organizar mi próxima quincena.`;if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(msg).then(()=>toast('Resumen copiado. Pégalo en ChatGPT.')).catch(()=>prompt('Copia este resumen:',msg));}else prompt('Copia este resumen:',msg);}
  document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;if(a==='backdrop'){if(e.target===b)closeModal();return;}if(a==='close'){closeModal();return;}if(a==='nav'){page=b.dataset.page;render();window.scrollTo(0,0);return;}if(a==='prev'||a==='next'){shiftPeriod(a==='prev'?-1:1);return;}if(a==='modal'){modal(b.dataset.kind,id);return;}if(a==='filter'){filter=b.dataset.filter;render();return;}if(a==='delete-movement'){deleteMovement(id);return;}if(a==='delete-debt'){deleteDebt(id);return;}if(a==='delete-goal'){deleteGoal(id);return;}if(a==='edit-debt'){modal('edit-debt',id);return;}if(a==='edit-goal'){modal('edit-goal',id);return;}if(a==='export-json'){exportJSON();return;}if(a==='export-csv'){exportCSV();return;}if(a==='copy-summary'){copySummary();return;}if(a==='reset-opening'){if(confirm('¿Quitar el saldo inicial? Los ingresos, gastos, deudas y ahorros seguirán guardados.')){state.opening=null;save();render();toast('Saldo inicial quitado.');}return;}if(a==='import'){el('backupInput')?.click();return;}});
  document.addEventListener('submit',e=>{if(e.target.id==='dataForm')return formSubmit(e);if(e.target.id==='budgetForm'){e.preventDefault();const data=new FormData(e.target),b={};for(const c of CATEGORIES){const n=Number(data.get(c));if(!Number.isFinite(n)||n<0||n>999999999){toast(`Revisa el presupuesto de ${c}.`);return;}b[c]=amount(n);}state.budgets=b;save();render();toast('Presupuesto guardado.');}});
  document.addEventListener('change',e=>{if(e.target.id==='backupInput'){importJSON(e.target.files?.[0]);e.target.value='';}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&activeModal)closeModal();});
  if('serviceWorker' in navigator&&['https:','http:'].includes(location.protocol))navigator.serviceWorker.register('./sw.js').catch(()=>{});
  render();
})();
</script>
